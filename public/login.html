<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel="shortcut icon" type="image/x-icon" href="../img/logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>AptoGarden</title>
</head>
<body>
    <div id="header-container"></div>

    <main class="main-login">

      <div class="login-container">
        <h2>Login</h2>
        <p>Entre com seus dados de acesso.</p>

        <label for="nome">Nome de Usuario:</label>
        <div class="input-icon-wrapper">
          <input type="text" id="nome" placeholder="fulano123">
          <span class="icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 24 24">
              <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
          </span>
        </div>

        <label for="senha">Senha:</label>
        <div class="input-icon-wrapper">
          <input type="password" id="senha" placeholder="*********">
          <span class="icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 24 24">
              <path d="M12 17a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm6-7h-1V7a5 
              5 0 0 0-10 0v3H6c-1.1 0-2 .9-2 
              2v8c0 1.1.9 2 2 2h12c1.1 
              0 2-.9 2-2v-8c0-1.1-.9-2-2-2zm-8-3a3 
              3 0 0 1 6 0v3H10V7z"/>
            </svg>
          </span>
        </div>

        <div class="options">
          <label><input type="checkbox"> Salvar acesso</label>
          <a href="#">Esqueceu sua senha?</a>
        </div>

        <button id="btnLogin" class="login-button">Logar</button>
    </div>
          
    </main>
    <div id="footer-container"></div>

  <script>
    document.getElementById('btnLogin').addEventListener('click', async function () {
      const nome = document.getElementById('nome').value.trim();
      const senha = document.getElementById('senha').value.trim();

      if (!nome || !senha) {
        alert('Preencha nome e senha!');
        return;
      }

      try {
        const response = await fetch('http://localhost:3000/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nome: nome, senha: senha }),
        });

        const data = await response.json();
        console.log("Nome encontrado no localStorage:", nome);

        if (response.ok) {
          localStorage.setItem('token', data.accessToken);
          localStorage.setItem('role', data.role);
          localStorage.setItem('nome', data.nome);
          localStorage.setItem('email', data.email);

          alert('Login realizado com sucesso!');
          window.location.href = '/index.html';
        } else {
          alert('Erro: ' + (data.message || 'Falha no login'));
        }
      } catch (error) {
        alert('Erro ao conectar com o servidor.');
      }
    });
  </script>
</body>
    <script>
       $(document).ready(function () {
            $('#header-container').load('header.html', function () {
            const role = localStorage.getItem('role');

            if (role !== 'admin') {
                const btnEstoque = document.getElementById('btnEstoque');
                if (btnEstoque) btnEstoque.style.display = 'none';

                const btnAdmin = document.getElementById('btnAdmin');
                if (btnAdmin) btnAdmin.style.display = 'none';
            }
            });
        });
        $(document).ready(function () {
            $('#footer-container').load('footer.html');
        });
    </script>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel="shortcut icon" type="image/x-icon" href="../img/logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>AptoGarden</title>
</head>
<body>
    <div id="header-container"></div>

    <main class="main-login">

      <div class="login-container">
        <h2>Login</h2>
        <p>Entre com seus dados de acesso.</p>

        <label for="email">Email:</label>
        <div class="input-icon-wrapper">
          <input type="email" id="email" value="fulanociclanosilva@dominio.com">
          <span class="icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 24 24">
              <path d="M20 4H4C2.89 4 2.01 4.89 2.01 6L2 18c0 1.11.89 2 2 2h16c1.11 
              0 2-.89 2-2V6c0-1.11-.89-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/>
            </svg>
          </span>
        </div>

        <label for="senha">Senha:</label>
        <div class="input-icon-wrapper">
          <input type="password" id="senha" value="***************">
          <span class="icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 24 24">
              <path d="M12 17a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm6-7h-1V7a5 
              5 0 0 0-10 0v3H6c-1.1 0-2 .9-2 
              2v8c0 1.1.9 2 2 2h12c1.1 
              0 2-.9 2-2v-8c0-1.1-.9-2-2-2zm-8-3a3 
              3 0 0 1 6 0v3H10V7z"/>
            </svg>
          </span>
        </div>

        <div class="options">
          <label><input type="checkbox"> Salvar acesso</label>
          <a href="#">Esqueceu sua senha?</a>
        </div>

        <button class="login-button">Logar</button>
    </div>
          
    </main>
    <div id="footer-container"></div>

</body>
    <script>
        $(document).ready(function () {
            $('#header-container').load('header.html');
        });
        $(document).ready(function () {
            $('#footer-container').load('footer.html');
        });
    </script>
</html>

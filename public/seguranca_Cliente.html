<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel="shortcut icon" type="image/x-icon" href="../img/logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>AptoGarden</title>
    <script>
        function habilitarEdicao(idCampo) {
          const campo = document.getElementById(idCampo);
          campo.removeAttribute('readonly');
          campo.focus();
        }
    </script>
      
</head>
<body>
    <div id="header-container"></div>

    <main>
        <h2 class="section-title" style="margin-bottom: 20px;">Segurança</h2>

        <div class="container-Segurança-cliente">
            <div class="box-alterar-senha">
                <div class="icone-texto">
                <svg class="icone" xmlns="http://www.w3.org/2000/svg" height="20" width="20" fill="#333" viewBox="0 0 24 24"><path d="M12 17a2 2 0 1 0 0-4 2 2 0 0 0 0 4Zm6-6h-1V9a5 5 0 0 0-10 0v2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2Zm-3 0H9V9a3 3 0 0 1 6 0v2Z"/></svg>
                <h3>Mudar senha</h3>
                </div>
                <p><span class="destaque">Clique aqui</span> caso deseje mudar sua senha.</p>
            </div>
            
            
            <div class="input-box">
                <label for="email">Email</label>
                <div class="input-editavel">
                <input type="text" id="email" value="fulanociclanosilva@dominio.com" readonly>
                <svg onclick="habilitarEdicao('email')" class="icone" xmlns="http://www.w3.org/2000/svg" height="20" width="20" fill="#333" viewBox="0 0 24 24"><path d="M3 17.25V21h3.75l11.06-11.06-3.75-3.75L3 17.25ZM20.71 7.04a1.003 1.003 0 0 0 0-1.41l-2.34-2.34a1.003 1.003 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83Z"/></svg>
                </div>
            </div>
            
        
            <div class="campos-duplos">
                <div class="input-box">
                <label for="cpf">CPF</label>
                <div class="input-editavel cpf-blur">
                    <input type="text" id="cpf" value="456.621.133.97" readonly>
                </div>
                </div>
            
                <div class="input-box">
                <label for="celular">Celular</label>
                <div class="input-editavel">
                    <input type="text" id="celular" value="+5511970700070" readonly>
                    <svg onclick="habilitarEdicao('celular')"class="icone" xmlns="http://www.w3.org/2000/svg" height="20" width="20" fill="#333" viewBox="0 0 24 24"><path d="M3 17.25V21h3.75l11.06-11.06-3.75-3.75L3 17.25ZM20.71 7.04a1.003 1.003 0 0 0 0-1.41l-2.34-2.34a1.003 1.003 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83Z"/></svg>
                </div>
                </div>
            </div>
        </div>
          


    </main>
    <div id="footer-container"></div>

</body>
    <script>
        $(document).ready(function () {
            $('#header-container').load('header.html');
        });
        $(document).ready(function () {
            $('#footer-container').load('footer.html');
        });
    </script>
</html>
